name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore modern solution
        run: dotnet restore HyphyOregon.ConferenceGenerator.slnx
      - name: Build Release
        run: dotnet build HyphyOregon.ConferenceGenerator.slnx --configuration Release --no-restore
      - name: Run complete test suite
        run: dotnet test HyphyOregon.ConferenceGenerator.slnx --configuration Release --no-build
      - name: Verify formatting
        run: dotnet format HyphyOregon.ConferenceGenerator.slnx --verify-no-changes --no-restore
      - name: Verify release metadata and assets
        run: dotnet test HyphyOregon.ConferenceGenerator.slnx --configuration Release --no-build --filter TestCategory=Stage4
